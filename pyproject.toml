[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "envdiff"
version = "0.1.0"
description = "Detect environment-variable drift between two sources — zero config, fully local."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kalki" }]
keywords = ["env", "dotenv", "diff", "cli", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = ["typer>=0.12", "rich>=13.0"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "black>=24.0",
    "mypy>=1.10",
]

[project.scripts]
envdiff = "envdiff.cli:app"

[project.urls]
Homepage = "https://github.com/Prasanth-000/envdiff"
Repository = "https://github.com/Prasanth-000/envdiff"

[tool.hatch.build.targets.wheel]
packages = ["src/envdiff"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["B008"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/envdiff --cov-report=term-missing"
